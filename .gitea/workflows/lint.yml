# Run the checks on the pull request that broke them, not on the release
# afterwards.
#
# The four content repositories run this same file. What differs between them
# is only what they have to check: `lint:lang` appears where there is a
# `lang/` tree and not otherwise, because a step with nothing to check is not
# parity — it is a green tick that means nothing.
#
# ## Named steps, not one `npm run lint`
#
# The chain is `run-s`, which stops at the first failure, so a single step
# would report whichever check failed first and say nothing about the rest.
# That is how two of these repositories had checks whose state nobody knew: the
# chain never reached them. Each step runs under `if: \${{ !cancelled() }}`,
# so one failure does not hide the others, and a red run is a worklist rather
# than a wall.
#
# ## The compile is a second job
#
# Both jobs fetch the same dependency content indexes — a satellite fetches the
# pinned system release the address, content-link and compile checks all
# resolve against — so both share that failure surface, and mixing the compile
# into the lint job would make a third party's outage read as a content
# failure. And a compile failure and a lint failure are both worth seeing in
# one run, rather than whichever comes first hiding the other.
#
# Every run is cold: `build/` is gitignored and holds the dependency catalogue
# too, so a runner starts with nothing.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Post-merge signal too: nothing else checks `main` between releases.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    format:
        name: Formatting, markdown and light checks
        runs-on: lint
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Prettier over the whole tree.
            - name: Check formatting
              run: npm run lint:format

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown
            - name: Check WIP workflow gating
              if: ${{ !cancelled() }}
              run: node --test utils/wip-workflows.test.mjs
    lint:
        name: Content, prose, and registry checks
        needs: format
        if: ${{ !cancelled() }}
        runs-on: lint

        steps:
            - name: Require a ready pull request
              id: ready
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  case "${PR_TITLE-}" in
                      [Ww][Ii][Pp]:*)
                          echo "WIP pull request: the long checks have not run. Remove WIP with earl pr ready." >&2
                          exit 1
                          ;;
                  esac
            - name: Require light checks
              run: test "${LIGHT_RESULT-success}" = success
              env:
                  LIGHT_RESULT: ${{ needs.format.result }}
              id: light_checks
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            - name: Install dependencies
              run: npm ci
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            # The address and content-link checks below resolve against the
            # dependency content indexes this fetches.
            - name: Fetch dependency indexes
              run: npm run build:deps
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            # Frontmatter against the schema each note's type declares.
            - name: Check addresses and frontmatter
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (!cancelled()) }}
              run: npm run lint:addresses

            # Every anchor link lands and every qualified address resolves.
            - name: Check content links
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (!cancelled()) }}
              run: npm run lint:content-links

    build:
        name: Content pack compile
        needs: format
        if: ${{ !cancelled() }}
        runs-on: build

        steps:
            - name: Require a ready pull request
              id: ready
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  case "${PR_TITLE-}" in
                      [Ww][Ii][Pp]:*)
                          echo "WIP pull request: the long checks have not run. Remove WIP with earl pr ready." >&2
                          exit 1
                          ;;
                  esac
            - name: Require light checks
              run: test "${LIGHT_RESULT-success}" = success
              env:
                  LIGHT_RESULT: ${{ needs.format.result }}
              id: light_checks
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && (success()) }}
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            - name: Install dependencies
              run: npm ci
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            # The compile below resolves embedded items against the
            # dependency content indexes this fetches.
            - name: Fetch dependency indexes
              run: npm run build:deps
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

            # Stages the tree, compiles every pack, and emits the content index
            # — the cold build a tree that has already built once cannot
            # perform on itself.
            - name: Compile the content packs
              run: npm run build:db
              if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') && steps.ready.outcome == 'success' && steps.light_checks.outcome == 'success' && (success()) }}

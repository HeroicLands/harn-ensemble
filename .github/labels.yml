# Authoritative label registry for the harn-ensemble repository.
#
# This file is the machine-readable source of truth for §3 of
# .github/ISSUE_REPORTING.md. Editing the registry means editing BOTH: this file
# (name/color/description) and the §3 table. Nothing checks that the two agree —
# this repository has no label-lint script — so they are kept in step by hand.
#
# GitHub's labels are reconciled to this file by the org-wide labels action, run by
# .github/workflows/labels-sync.yml. The set is CLOSED: any label on GitHub that
# is not listed here is deleted on sync. Do not invent labels — extending the
# registry is a deliberate edit to this file and §3. A description must be 100
# characters or fewer — GitHub's own limit, which that action checks in both
# modes, so an over-long one fails the pull request rather than the sync.
#
# The registry is narrow, because the repository is: it ships Foundry compendium
# packs and the one page announcing them, and nothing else. `system` and `tests`
# are absent — there is no system code and no test suite here. `site` is present:
# the package publishes a homepage at https://www.heroiclands.org/harnensemble/,
# built and deployed from this repository, so that work is delivered here.

- name: content
  color: "58ec8d"
  description: Hârn Ensemble material — character notes, affiliations, actors, journals, packs, artwork.

- name: documentation
  color: "0075ca"
  description: Documentation about this repository — README, process, authoring guides.

- name: site
  color: "24bdb0"
  description: The /harnensemble/ homepage — its content, the Hugo build, the Cloudflare Pages deployment.

- name: devops
  color: "e07b31"
  description: Build, tooling, pack pipeline, release, repo config.

- name: security
  color: "b60205"
  description: "Attack surface: data integrity, script execution, injection, or private-disclosure risk."

- name: tech-debt
  color: "68691b"
  description: Restructuring or cleanup of working content or tooling; refactors.

- name: regression
  color: "d93f0b"
  description: Something that previously worked and stopped. Pairs with type bug.

- name: breaking-change
  color: "8d0f09"
  description: Alters a shortcode, document ID, or pack compatibility in a way worlds will notice.

- name: blocked
  color: "c5702e"
  description: Cannot proceed until an external dependency or another issue clears.

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists.

- name: question
  color: "0f5594"
  description: Further information is requested.

- name: wontfix
  color: "ffffff"
  description: This will not be worked on.

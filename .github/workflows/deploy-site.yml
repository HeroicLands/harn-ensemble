# Build and deploy /harnensemble — this package's published site (#10, #53).
#
# The runner, the completeness guard, the hosting project, the custom domain and
# the upload are identical for every package that publishes a subtree of
# www.heroiclands.org, and they are exactly the parts that must not drift. So
# they live once in HeroicLands/.github and this repository calls them. What
# stays here is the build: `npm run build:site`, which the shared workflow runs
# and knows nothing else about.
#
# `min-pages` / `max-pages` are REQUIRED in `content` mode — the shared
# workflow reads `publish.site` from the same config the build reads, and
# fails the run rather than deploy an ungoverned page count. `min-pages` is a
# floor set below a complete build's page count, not an assertion about
# today's count: it catches a collapsed build, not a change in how many notes
# this package carries. `max-pages` is a ceiling with the same margin the
# other way. Measured: a complete build carries 2535 pages. Set with headroom
# on both sides of that figure — a floor and a ceiling that catch a collapsed
# or runaway build, not a description of today's count.
#
# No `_headers` either: HeroicLands/.github#7 is making the shared workflow
# supply the default, rather than four repositories each carrying the same six
# lines.
name: Deploy the Hârn Ensemble site to Cloudflare Pages

on:
    # Every push to `main` republishes the page. No path filter: a rebuild is
    # cheap next to how quietly a hand-maintained path list goes stale, and a
    # push that changes nothing the site serves merely republishes the same
    # bytes.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        uses: HeroicLands/.github/.github/workflows/deploy-package-site.yml@main
        with:
            # Not derived from the package name: a Pages project's name is its
            # deployment history, so it is stated rather than computed.
            project: harn-ensemble
            # Measured: a complete build carries 2535 pages (2534 content + 1
            # homepage). Set with headroom on both sides to catch a collapsed or
            # runaway build.
            min-pages: 2200
            max-pages: 3100
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Ensemble of Hârn NPCs — this package's homepage (#10).
#
# This repository publishes **one page**, at the address the package is served
# from. Its content tree is 2,517 notes of NPC material that ships as a Foundry
# module, not as a website, so `publish.site: homepage` in
# `package-build.config.yaml` is the structural fence that keeps the tree
# unpublished: `buildSite` writes the homepage and returns before the content
# walk. Nothing below reopens that.
#
# `baseURL` is the one place the site's address is written down. It derives from
# `contentPackage` — `harnensemble` — and not from the repository name, which is
# `harn-ensemble`.
baseURL = "https://www.heroiclands.org/harnensemble/"
locale = "en-us"

# The manifest title, so the package is named the same in Foundry's package
# browser and in a browser tab. The homepage note itself declares no `title:`
# and inherits the same value, so the two cannot disagree.
title = "Ensemble of Hârn NPCs"

# The output is published *with* the prefix — `build/site/harnensemble/` — and
# the deploy uploads `build/site`, whose root is the hosting project's origin.
# So the deployed tree carries its own prefix physically: the router proxies
# `/harnensemble/…` straight through without rewriting the path, and the same
# deployment behaves identically at the project's own address.
#
# Relative to the **Hugo root**, which is this directory, not the repository
# root.
publishDir = "../build/site/harnensemble"

# Brand chrome, the palette, the 404 page and the package-landing layout come
# from the shared theme, so this page reads as one whole with www and its
# sibling packages. It arrives through `npm ci`, not a git submodule: Hugo looks
# for `<themesDir>/<theme>`, so the package's scope is the themes directory and
# its name is the theme name — nothing is copied and no module mounts are
# needed.
#
# Also relative to the Hugo root; the lockfile that installed the theme is one
# level up.
themesDir = "../node_modules/@heroiclands"
theme = "hugo-theme"

# Generated by `npm run build:site-content` (`content-build site`) from
# `assets/content/homepage.md`. In homepage mode this directory holds exactly
# one file, `_index.md`, and it is wiped and rewritten on every run — nothing in
# it is authored.
contentDir = "content"

# Everything but the landing, switched off at the source.
#
# This is a correctness setting, not tidiness. Hugo's defaults would emit a
# taxonomy root for `tags` and for `categories` — neither of which this one page
# authors — plus an RSS feed and a sitemap. In `homepage` mode the deploy's
# completeness guard fixes the page count at **exactly one** and fails the run on
# anything more, so a stray empty `/tags/index.html` is a red build rather than
# an untidy one.
#
# `home` is deliberately absent from the list: it is the landing, and it is the
# whole site.
#
# It must stay ABOVE the first table header. TOML binds a bare key to the table
# most recently opened, so this line written further down — after `[params]` or
# `[menu]` — parses as `menu.disableKinds`, which Hugo neither reads nor
# rejects: the setting silently does nothing and the taxonomy roots come back.
disableKinds = ["section", "taxonomy", "term", "RSS", "sitemap"]

[params]
  description = "Over a thousand ready-made NPCs for you to use in your games in the Hârn setting."
  author = "Tom Rodriguez"

  # The theme carries layout, not addresses, so every site-specific URL it
  # renders is supplied here. The header logo and the 404 page's banner resolve
  # through `partials/cdn-url.html` against this host; with it unset they would
  # resolve against this site, which publishes no imagery of its own and would
  # answer 404 for both.
  cdnBaseURL = "https://cdn.heroiclands.org"

  [params.brand]
    logo       = "images/brand/sohl-icon-white.webp"
    licenseURL = "https://www.heroiclands.org/license/"
    discordURL = "https://discord.gg/EwMfkNd3az"

  # The "page not found" page. Its template is the theme's, since every
  # consumer needs one; the wording and the routes back are ours. A
  # homepage-only site has exactly one route back, so it offers exactly one — a
  # relative `url` is resolved against this site's own base, so it survives a
  # move.
  [params.notfound]
    tagline  = "This site has no page at"
    sitenoun = "site"

    [[params.notfound.links]]
      title = "Ensemble of Hârn NPCs"
      url   = "/"
      text  = "What the module is, and how to install it."

# The brand nav. Absolute URLs so this header matches the one every other site
# renders; defined here rather than in the shared theme, which carries no
# addresses of its own.
[menu]
  [[menu.main]]
    name = "Home"
    url = "https://www.heroiclands.org/"
    weight = 1
  [[menu.main]]
    name = "Song of Heroic Lands"
    url = "https://www.heroiclands.org/projects/song-of-heroic-lands/"
    weight = 2
  [[menu.main]]
    name = "HârnMaster 3"
    url = "https://www.heroiclands.org/projects/hm3/"
    weight = 3
  [[menu.main]]
    name = "Modules"
    url = "https://www.heroiclands.org/projects/modules/"
    weight = 4
  [[menu.main]]
    name = "License"
    url = "https://www.heroiclands.org/license/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

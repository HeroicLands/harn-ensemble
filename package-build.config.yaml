# See `@heroiclands/package-build` for the full documentation.
#

contentPackage: harnensemble
packageKind: modules

stats:
    lastModifiedBy: harnensbuild0000

compatibility:
    minimum: "14.359"
    verified: "14.367"

# A `journals` pack was declared here from the initial commit and never had a
# source. The journals pass compiles a note whose `type` is `doc`, or one of the
# doc-carrying types (every item type, plus `macro` and the map types); this tree
# holds 2,512 `being`, 5 `affiliation` and one `homepage` note and has never held
# a `doc` one. So the pass walked all 2,518 notes, rejected every one, emitted
# nothing and failed the build.
#
# Nothing is lost by dropping it. A being's `{#appearance}` and `{#dossier}`
# sections are rendered into the Actor itself, so the character prose ships in
# the Actor packs where a reader meets the character — it was never going to
# appear in a JournalEntry. If this module ever ships journal prose of its own,
# the pack comes back with notes to fill it, the way the items pack will.
packs:
    - name: actors-hm3
      label: Actors
      type: Actor
      system: hm3
    - name: actors-sohl
      label: Actors
      type: Actor
      system: sohl

# `site` is a mode, not a switch: every package publishes an authored homepage at
# https://www.heroiclands.org/<contentPackage>/ — here /harnensemble/, an address
# that derives from `contentPackage` above and not from the repository name — and
# the mode says how much *else* is published. `homepage` publishes that one page
# and nothing beneath it; `content` publishes every page the content tree
# compiles to.
#
# `content`, because this tree is worth reading outside Foundry. A note here is
# an NPC and its properties — a name, an occupation, the numbers a GM reads off
# at the table — and a roster of two and a half thousand of those is a reference:
# as useful on the web, and as the release PDF (#53), as it is in a compendium.
# The mode is also the switch the PDF is fenced behind
# (HeroicLands/package-build#316), so publishing the pages and publishing the
# document is one decision rather than two that could come to disagree.
#
# `manifests` stays off in both directions, and is a separate question. A link
# manifest is the dependency edge — emitting one would let other packages cite
# these addresses and make the module something the project has to keep.
# Publishing pages creates no such edge: a reader follows a URL, a build does
# not.
publish:
    site: content
    manifests: { publish: false, consume: false }

# Where the site build writes, and how this repository frames what it publishes.
# `out` is required in *both* modes and deliberately not defaulted: the output
# root is wiped on every run, and an unset value would resolve to the repository
# root. `publish.address` is absent, so the prefix is its default `""` — this
# package's content *is* its site, so the tree mounts at the package root and a
# page publishes at /harnensemble/<type>-<shortcode>/.
site:
    out: site/content
    # Every section this package publishes, so /harnensemble/<section>/ answers
    # with a titled page rather than a directory listing. A section is a note's
    # own `type` (`sectionOf`), not a directory name, and a page is written into
    # that section's directory — so a declared section's landing lists its own
    # pages and needs nothing else said about it. A section left undeclared here
    # still gets a bare landing, but with no title.
    #
    # Two sections, because the tree publishes two types: 2,512 `being` notes and
    # 5 `affiliation`. The 17 `folder` notes are structure for the compendium,
    # not pages, and address nothing on the web.
    sections:
        affiliation: { title: Affiliations }
        being: { title: Characters }

packageBuild:
    assets:
        - { from: assets/images, to: assets/images }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }

    manifest:
        title: Ensemble of Hârn NPCs
        description: >-
            Over a thousand ready-made NPCs for you to use
            in your games in the Hârn setting.
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE
        readme: README.md
        packFolders:
            - name: Hârn Ensemble
              sorting: m
              color: "#5b2c1d"
              packs:
                  - actors-hm3
                  - actors-sohl
        flags:
            allowBugReporter: true

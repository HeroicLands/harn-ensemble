# See `@heroiclands/package-build` for the full documentation.
#

contentPackage: harnensemble
packageKind: modules

stats:
    lastModifiedBy: harnensbuild0000

compatibility:
    minimum: "14.359"
    verified: "14.367"

packs:
    - name: actors-hm3
      label: Actors
      type: Actor
      system: hm3
    - name: actors-sohl
      label: Actors
      type: Actor
      system: sohl
    - name: journals
      label: Journals
      type: JournalEntry

# `site` is a mode, not a switch: every package publishes an authored homepage at
# https://www.heroiclands.org/<contentPackage>/ — here /harnensemble/, an address
# that derives from `contentPackage` above and not from the repository name — and
# the mode says how much *else* is published. `homepage` publishes that one page
# and nothing beneath it; `content` would publish every page the content tree
# compiles to. Nothing in this tree is meant for the web: the module is what
# ships, and a page announcing it discloses none of the material.
#
# `manifests` stays off in both directions for a separate reason. A link manifest
# is the dependency edge — emitting one would let other packages cite these
# addresses and make the module something the project has to keep. A homepage is
# one row in a routing table and creates no such edge.
publish:
    site: homepage
    manifests: { publish: false, consume: false }

# Where the site build writes. Required in *both* modes and deliberately not
# defaulted: the output root is wiped on every run, and an unset value would
# resolve to the repository root. In `homepage` mode this directory is the whole
# of the output — the homepage is written to its root, one level above the
# content mount that only `content` mode has.
site:
    out: site/content

packageBuild:
    assets:
        - { from: assets/images, to: assets/images }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }

    manifest:
        title: Ensemble of Hârn NPCs
        description: >-
            Over a thousand ready-made NPCs for you to use
            in your games in the Hârn setting.
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE
        readme: README.md
        packFolders:
            - name: Hârn Ensemble
              sorting: m
              color: "#5b2c1d"
              packs:
                  - actors-hm3
                  - actors-sohl
                  - journals
        flags:
            allowBugReporter: true

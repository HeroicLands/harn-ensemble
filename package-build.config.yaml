contentPackage: harnensemble
packageKind: modules

stats:
    lastModifiedBy: harnensbuild0000

compatibility:
    minimum: "14.359"
    verified: "14.367"

# This module ships no `requiresSystem`, so a world loads whichever of these
# packs matches the system it runs.
systems:
    hm3:
        manifest: https://github.com/HeroicLands/HarnMaster-3-FoundryVTT/releases/download/v1.6.3/system.json
        compatibility:
            verified: "1.6.3"
    sohl:
        manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/download/v0.8.5/system.json
        compatibility:
            verified: "0.8.5"

# `sohl`'s `{ model: skill-init }` embeds on a being resolve against its own
# Item catalog, so `itemCatalog: true` extracts that release's packs as a
# resolution source, pinned to the `verified` version below.
#
# HM3 embeds items the same way but declares no matching relationship here:
# every published HarnMaster-3-FoundryVTT release predates `flags.metadataUrl`
# (needs a release built with package-build 18 or later), so its content index
# cannot be cached, and `deps fetch` fetches every declared relationship's
# index unconditionally — so declaring it anyway would fail the fetch for
# `sohl` too. The `actors-hm3` pack does not compile until a compatible HM3
# release exists.
relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/download/v0.8.5/system.json
          compatibility:
              verified: "0.8.5"
          itemCatalog: true

itemBuilders: [sohl, hm3]

# `journals` is undivided by system: a being's `{#appearance}` and `{#dossier}`
# prose compiles into a JournalEntry, which is not a system-specific document.
#
# `items-sohl` is the only document class `affiliation` notes compile to
# under `sohl`, since no system maps `affiliation` to an Actor or a
# JournalEntry.
packs:
    - name: actors-hm3
      label: Actors
      type: Actor
      system: hm3
    - name: actors-sohl
      label: Actors
      type: Actor
      system: sohl
    - name: items-sohl
      label: Items
      type: Item
      system: sohl
    - name: journals
      label: Journals
      type: JournalEntry
      default: true

# `content`: a note here is an NPC and its properties, and a roster of them
# is a reference worth reading outside Foundry — on the web and in the
# release PDF, not only in a compendium.
publish:
    site: content

site:
    assets: https://cdn.heroiclands.org

    description: Over a thousand ready-made NPCs for you to use in your games in the Hârn setting.

    # Two sections, because the tree publishes two types: `being` and
    # `affiliation`. `folder` notes are structure for the compendium, not
    # pages, and address nothing on the web.
    sections:
        affiliation: { title: Affiliations }
        being: { title: Characters }

    notfound:
        tagline: This site has no page at
        sitenoun: site
        links:
            - title: Ensemble of Hârn NPCs
              url: /
              text: What the module is, and how to install it.

    # `markup.highlight.style` is this repository's own choice — the generator
    # fixes `markup.goldmark.renderer.unsafe` for every site, but not this key.
    hugo:
        markup:
            highlight:
                style: monokai

packageBuild:
    assets:
        - { from: assets/images, to: assets/images }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }

    manifest:
        descriptionHtml: Over a thousand ready-made NPCs for you to use in your games in the Hârn setting.
        title: Ensemble of Hârn NPCs
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE
        readme: README.md
        packFolders:
            - name: Hârn Ensemble
              sorting: m
              color: "#5b2c1d"
              packs:
                  - actors-hm3
                  - actors-sohl
                  - items-sohl
                  - journals
        flags:
            allowBugReporter: true
